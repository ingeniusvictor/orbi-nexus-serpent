name: Nexus Serpent - Build and Type Audit

on:
  push:
    branches: [develop, feature/assault-rv10b-telegraphed-artillery, feature/assault-rv10c-blackout-intelligence, feature/assault-rv11-visual-continuity-serpent-identity, feature/assault-rv12-camera-body-watchdog]
  pull_request:
    branches: [main, develop, feature/assault-rv02-nine-energies, feature/assault-rv10-tactical-formations, feature/assault-rv10b-telegraphed-artillery, feature/assault-rv10c-blackout-intelligence, feature/assault-rv11-visual-continuity-serpent-identity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies from retained Bun lockfile
        run: bun install --frozen-lockfile
      - name: Verify panoramic Assault world regression invariants
        run: bun run qa:assault-landscape
      - name: Test Assault Resonance geometry and non-damaging preview
        run: bun run qa:assault-geometry
      - name: Verify Assault preview stays isolated from combat
        run: bun run qa:assault-preview-scope
      - name: Test free Assault revival and inactive ORBI currency
        run: bun run qa:assault-revive
      - name: Audit revival scope and wallet invariants
        run: bun run qa:assault-revive-scope
      - name: Validate nine-energy Assault progression and GAIA isolation
        run: bun run qa:assault-nine-energies
      - name: Audit Assault RV-03 GAIA and late-game effect limits
        run: bun run qa:assault-rv03
      - name: Validate node-local targeting and resonance damage
        run: bun run qa:assault-rv04
      - name: Validate four-tier legendary card odds
        run: bun run qa:assault-rv05
      - name: Validate boss-gated GAIA awakening and lifetime
        run: bun run qa:assault-rv06
      - name: Validate deterministic elite and pre-boss room director
        run: bun run qa:assault-rv07
      - name: Validate RV-08 mutations and selected fusion recipes
        run: bun run qa:assault-rv08
      - name: Validate Foton, core spawn and GAIA supreme form
        run: bun run qa:assault-rv09
      - name: Validate RV-10A and RV-10B tactical combat regression
        run: bun run qa:assault-rv10b
      - name: Validate RV-10C charge, flank and split guards
        run: bun run qa:assault-rv10c
      - name: Validate RV-11 visual continuity and serpent boss identity
        run: bun run qa:assault-rv11
      - name: Validate RV-12 camera/body watchdog and regressions
        run: bun run qa:assault-rv12
      - name: Build web application
        run: bun run build
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-serpent-web-build
          path: dist/
          if-no-files-found: error

  types:
    name: TypeScript baseline (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Collect TypeScript diagnostics
        shell: bash
        run: |
          set +e
          bun run check:types > typescript-diagnostics.txt 2>&1
          status=$?
          echo "TypeScript exit status: $status"
          grep -c 'error TS[0-9]*:' typescript-diagnostics.txt || true
          # Keep the precise failing locations visible to the RV-08 audit.
          sed -n '1,90p' typescript-diagnostics.txt
          exit "$status"
      - name: Upload diagnostics even if type check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-serpent-typescript-diagnostics
          path: typescript-diagnostics.txt
          if-no-files-found: warn
